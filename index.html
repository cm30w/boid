<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>simpleboid</title>
        <link rel="stylesheet" href="boidstyle.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="menu">
            <h2>Boid Controls</h2>
            <p class="description">Adjust parameters to control the flocking behavior of the boids. Refresh page to reset / randomize wind vector field directions.</p>
            
            <div class="control-group">
                <label for="speedSlider">Speed: <span id="speedValue">60</span></label>
                <input type="range" id="speedSlider" min="15" max="600" value="60" step="5">
                <div class="speed-labels">
                    <span>15</span>
                    <span>600</span>
                </div>
            </div>

            <div class="control-group">
                <label for="cohesionSlider">Cohesion: <span id="cohesionValue">10</span></label>
                <input type="range" id="cohesionSlider" min="0" max="30" value="10" step="1">
                <div class="speed-labels">
                    <span>0</span>
                    <span>30</span>
                </div>
            </div>

            <div class="control-group">
                <label for="separationValue">Separation: <span id="separationValue">20</span></label>
                <input type="range" id="separationSlider" min="0" max="40" value="20" step="1">
                <div class="speed-labels">
                    <span>0</span>
                    <span>40</span>
                </div>
            </div>

            <div class="control-group">
                <label for="alignmentValue">Alignment: <span id="alignmentValue">10</span></label>
                <input type="range" id="alignmentSlider" min="0" max="30" value="10" step="1">
                <div class="speed-labels">
                    <span>0</span>
                    <span>30</span>
                </div>
            </div>

            <div class="control-group">
                <label for="windValue">Wind Impact: <span id="windValue">20</span></label>
                <input type="range" id="windSlider" min="0" max="100" value="20" step="1">
                <div class="speed-labels">
                    <span>0</span>
                    <span>30</span>
                </div>
            </div>

            <div class="control-group">
                <label for="perceptionSlider">Perception Radius: <span id="perceptionValue">100</span></label>
                <input type="range" id="perceptionSlider" min="20" max="200" value="100" step="5">
                <div class="speed-labels">
                    <span>20</span>
                    <span>200</span>
                </div>
            </div>

            <div class="control-group">
                <label for="separationRadiusSlider">Separation Distance: <span id="separationRadiusValue">30</span></label>
                <input type="range" id="separationRadiusSlider" min="10" max="100" value="30" step="5">
                <div class="speed-labels">
                    <span>10</span>
                    <span>100</span>
                </div>
            </div>

            
            

        </div>

        <canvas id="canvas1"></canvas>

        <script src="boidscript.js"></script>
    </body>
</html>
